[package]
name = "hydra-sploit"
version = "7.0.0"
edition = "2021"
authors = ["Mr. Harith"]
description = "Hydra-Sploit: Full Offensive Stack with Metasploit Integration"
license = "MIT license"
repository = "https://github.com/HarithBUGbounty/Hydra-Sploit.git"

[dependencies]
reqwest = { version = "0.13.4", features = ["blocking"] }
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1.0"
serde = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = []
advanced = ["serde", "serde_json"]

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true
debug = false

[build-dependencies]
# None — pure Rust, no build script needed